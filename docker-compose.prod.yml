services:
  api:
    build: .
    ports:
      - "5001:5001"
    env_file: .env
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
    depends_on:
      - redis
    restart: unless-stopped
    command: ["node", "dist/server.js"]
    working_dir: /src

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    restart: unless-stopped